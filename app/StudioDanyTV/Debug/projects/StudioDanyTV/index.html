<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Studio Dany TV</title>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <script src="js/gl.js"></script>
    <script src="js/shaders.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/decor.js"></script>
    <script src="js/ambient.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/radio.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>

    <div class="hud">
        <div class="clock"><span id="hm">00:00</span><span class="sec" id="ss">00</span></div>
        <div class="date" id="date">&nbsp;</div>
        <div class="weather" id="wx">cargando clima…</div>
    </div>

    <div class="radio">
        <span class="bars off" id="bars"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="slot" id="radioSlot">lofi radio</span><span id="radioLabel">cargando…</span>
    </div>
    <div class="corner">
        <div class="tag">STUDIO DANY VA</div>
        <div class="place">Playa del Carmen · MX</div>
    </div>

    <pre id="dev" class="dev hidden"></pre>
    <div id="devmark" class="devmark hidden">DEV</div>
    <audio id="radioA" preload="none"></audio>
    <audio id="radioB" preload="none"></audio>
</body>
</html>
